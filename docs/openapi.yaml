openapi: 3.1.0
info:
  title: Memory API
  version: "1.0"
  description: |
    Контракт сервера Memory. Его уже исполняет встроенный демо-сервер на
    телефоне (Android: data/net/DemoServer.kt, iPhone: Data/Net/DemoServer.swift);
    настоящий сервер — server/ (Kotlin, Ktor) — отвечает так же. Подробно —
    docs/API.md, запуск сервера — docs/SERVER.md.

    Общие правила:
    - Все изменения принимают заголовок `Idempotency-Key` (UUID). Повтор с тем же
      ключом возвращает тот же ответ (200) и ничего не создаёт второй раз.
    - Списки — страницами по курсору: `?limit=20&cursor=…`; в ответе `next`
      (null — дальше пусто). Курсор непрозрачный для клиента.
    - Ошибки: 4xx — не повторять (кроме 408 и 429), 5xx и 429 — повторить позже;
      `Retry-After` (секунды) — когда.
    - Записи и сообщения — тот же JSON, что клиент хранит на телефоне
      (StateStore.Codec): люди — по номеру (`author`), время — мс.
servers:
  - url: https://api.example.am
    description: Замените на адрес сервера (API_URL)
security:
  - bearer: []
paths:
  /v1/feed:
    get:
      summary: Лента — новые сверху
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Страница записей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
  /v1/users/{userId}/posts:
    get:
      summary: Записи человека
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Страница записей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
  /v1/posts:
    post:
      summary: Опубликовать запись
      description: |
        Вложения — уже загруженные через /v1/uploads: `media[].path` — адрес
        загрузки (`/v1/uploads/{id}`). Незаконченная загрузка — 422.
      parameters:
        - $ref: "#/components/parameters/idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Post" }
      responses:
        "201":
          description: Создана; ответ — запись с номером сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "200":
          description: Уже была создана с этим Idempotency-Key — та же запись
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "422": { description: Вложение не загружено целиком или запись не разобрать }
  /v1/posts/{postId}/like:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: integer, format: int64 } }
      - $ref: "#/components/parameters/idempotency"
    put:
      summary: Нравится (повтор безопасен)
      responses: { "204": { description: Готово } }
    delete:
      summary: Больше не нравится (повтор безопасен)
      responses: { "204": { description: Готово } }
  /v1/chats/{chatId}/messages:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: integer } }
    get:
      summary: История переписки — новые сверху
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Страница сообщений
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  next: { type: [string, "null"] }
    post:
      summary: Отправить сообщение
      description: |
        В секретной переписке `text` — конверт (base64, X25519 + AES-256-GCM):
        сервер хранит и пересылает его, прочитать не может. Вложения в
        секретных переписках пока не отправляются.
      parameters:
        - $ref: "#/components/parameters/idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Message" }
      responses:
        "201":
          description: Принято
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "200":
          description: Уже было с этим Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /v1/auth/login:
    post:
      summary: Войти с этого устройства
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
                device:
                  type: object
                  properties: { name: { type: string }, platform: { enum: [android, ios, web] } }
      responses:
        "200":
          description: Токены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { description: Неверный логин или пароль }
  /v1/auth/refresh:
    post:
      summary: Новая пара токенов по токену обновления
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refresh], properties: { refresh: { type: string } } }
      responses:
        "200":
          description: Токены (старый токен обновления больше не действует)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { description: "Сессия закрыта (вышли с этого устройства) — войти заново" }
  /v1/auth/logout:
    post:
      summary: Выйти с этого устройства
      responses: { "204": { description: Готово } }
  /v1/auth/register:
    post:
      summary: Новый аккаунт (и сразу вход с этого устройства)
      description: |
        Телефон зовёт его сам, если вход ответил 401 (аккаунт заведён на
        телефоне раньше, чем появился сервер). Демо-сервер отвечает как на вход.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, pattern: "^[a-z0-9._]{3,32}$" }
                password: { type: string, minLength: 6 }
                name: { type: string, maxLength: 60 }
                device:
                  type: object
                  properties: { name: { type: string }, platform: { enum: [android, ios, web] } }
      responses:
        "201":
          description: Токены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { description: Логин или пароль не подходят }
        "409": { description: Логин занят }
  /v1/users:
    get:
      summary: Поиск людей по логину и имени (от 2 знаков, до 20 человек)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200":
          description: Люди
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
  /v1/users/{userId}:
    get:
      summary: Человек — имя, логин, открытый ключ шифрования
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Человек
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { description: Нет такого }
  /v1/me/key:
    put:
      summary: Свой открытый ключ X25519 (base64) — для секретных переписок
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [publicKey], properties: { publicKey: { type: string } } }
      responses: { "204": { description: Сохранён } }
  /v1/chats/direct:
    post:
      summary: Личная переписка с человеком (одна на пару; номер выбирает сервер)
      description: |
        Для собеседника она — запрос (`accepted: false`), пока он не ответит
        или не примет: до этого его «прочитано» и «печатает» не пересылаются.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user], properties: { user: { type: integer } } }
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "200":
          description: Уже была
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
  /v1/devices:
    get:
      summary: Устройства, с которых вошли
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        platform: { type: string }
                        lastSeen: { type: integer, format: int64 }
                        current: { type: boolean }
  /v1/devices/{deviceId}:
    delete:
      summary: Выйти на другом устройстве
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses: { "204": { description: Готово }, "404": { description: Нет такого (или это текущее) } }
  /v1/devices/revoke-others:
    post:
      summary: Выйти на всех, кроме этого
      responses: { "204": { description: Готово } }
  /v1/me:
    get:
      summary: Профиль и приватность (общие для всех телефонов)
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { description: Ещё не сохраняли (первый вход) }
    put:
      summary: Сохранить профиль и приватность
      parameters:
        - $ref: "#/components/parameters/idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "200":
          description: Сохранено (updatedAt — время сервера)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /v1/chats:
    get:
      summary: Мои переписки на сервере — личные и группы (сверка после перерыва)
      responses:
        "200":
          description: Переписки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Group" } }
    post:
      summary: Новая группа
      description: Номер выбирает клиент (случайный); занят — 409, клиент выбирает другой.
      parameters:
        - $ref: "#/components/parameters/idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, title, members]
              properties:
                id: { type: integer }
                title: { type: string, maxLength: 60 }
                members: { type: array, items: { type: integer }, maxItems: 200 }
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "409": { description: Номер занят }
  /v1/chats/{chatId}:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Переименовать группу (админ)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { title: { type: string, maxLength: 60 } } }
      responses:
        "200":
          description: Группа
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "403": { description: Не админ }
  /v1/chats/{chatId}/members/{userId}:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: integer } }
      - { name: userId, in: path, required: true, schema: { type: integer } }
    put:
      summary: Добавить участника (админ)
      responses: { "204": { description: Готово }, "403": { description: Не админ } }
    delete:
      summary: Убрать участника (админ) или выйти самому (свой номер)
      responses: { "204": { description: Готово }, "403": { description: Не админ или это создатель } }
  /v1/chats/{chatId}/admins/{userId}:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: integer } }
      - { name: userId, in: path, required: true, schema: { type: integer } }
    put:
      summary: Сделать админом (только создатель)
      responses: { "204": { description: Готово } }
    delete:
      summary: Снять админа (только создатель)
      responses: { "204": { description: Готово } }
  /v1/chats/{chatId}/read:
    post:
      summary: Прочитано до (если живой канал не подключён)
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { upTo: { type: integer, format: int64 } } }
      responses: { "204": { description: Готово } }
  /v1/chats/{chatId}/accept:
    post:
      summary: Принять запрос на переписку
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: integer } }
      responses: { "204": { description: Готово } }
  /v1/posts/{postId}:
    patch:
      summary: Изменить свою запись (сейчас — включить/выключить комментарии)
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { commentsOff: { type: boolean } } }
      responses: { "204": { description: Готово } }
  /v1/uploads:
    options:
      summary: Возможности tus
      security: []
      responses:
        "204":
          description: Tus-Version, Tus-Max-Size, Tus-Extension
    post:
      summary: Создать загрузку (tus 1.0, расширение creation)
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { const: "1.0.0" } }
        - { name: Upload-Length, in: header, required: true, schema: { type: integer, format: int64 } }
        - { name: Upload-Metadata, in: header, schema: { type: string }, description: "filename <base64>,filetype <base64>" }
      responses:
        "201":
          description: Создана
          headers:
            Location: { schema: { type: string }, description: "Адрес загрузки (/v1/uploads/{id})" }
        "412": { description: Не та версия tus }
        "413": { description: Слишком большой файл (больше 2 ГБ) }
  /v1/uploads/{uploadId}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
      - { name: Tus-Resumable, in: header, required: true, schema: { const: "1.0.0" } }
    head:
      summary: Сколько уже дошло — с этого места продолжать
      responses:
        "200":
          description: Upload-Offset, Upload-Length
        "404": { description: Нет такой (или истёк срок) — начать заново }
    patch:
      summary: Дослать кусок
      parameters:
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Принято; Upload-Offset — новое смещение
        "409": { description: Смещение не совпало — спросить HEAD и продолжить }
        "415": { description: Нужен Content-Type application/offset+octet-stream }
    get:
      summary: Скачать загруженное (любой вошедший; файлы секретных переписок — шифротекст)
      responses:
        "200":
          description: Файл; Content-Type — из filetype в Upload-Metadata
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "409": { description: Ещё не загружен целиком }
    delete:
      summary: Отменить загрузку (расширение termination)
      responses: { "204": { description: Удалена } }
  /v1/explore:
    get:
      summary: «Интересное» — записи открытых профилей, на которых я не подписан (новые сверху)
      description: "/v1/feed — только мои записи и тех, на кого я подписан."
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
  /v1/users/{userId}/follow:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer } }
    put:
      summary: Подписаться (закрытому профилю — заявка)
      responses:
        "200":
          description: "state: following | requested"
          content:
            application/json:
              schema: { type: object, properties: { state: { enum: [following, requested] } } }
    delete:
      summary: Отписаться или отозвать заявку
      responses:
        "200": { description: "state: none" }
  /v1/me/following:
    get:
      summary: На кого я подписан
      responses:
        "200":
          description: Люди
          content: { application/json: { schema: { $ref: "#/components/schemas/UserList" } } }
  /v1/me/followers:
    get:
      summary: Мои подписчики
      responses:
        "200":
          description: Люди
          content: { application/json: { schema: { $ref: "#/components/schemas/UserList" } } }
  /v1/me/followers/{userId}:
    delete:
      summary: Убрать подписчика
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses: { "204": { description: Готово } }
  /v1/me/sent:
    get:
      summary: Мои заявки, которые ждут ответа
      responses:
        "200":
          description: Люди
          content: { application/json: { schema: { $ref: "#/components/schemas/UserList" } } }
  /v1/me/requests:
    get:
      summary: Заявки ко мне (закрытый профиль)
      responses:
        "200":
          description: Люди
          content: { application/json: { schema: { $ref: "#/components/schemas/UserList" } } }
  /v1/me/requests/{userId}:
    delete:
      summary: Отклонить заявку (человек не узнает)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses: { "204": { description: Готово } }
  /v1/me/requests/{userId}/accept:
    post:
      summary: Принять заявку; телефон затем подписывается в ответ — дружба в Memory взаимная
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses: { "204": { description: Готово } }
  /v1/me/close-friends:
    get:
      summary: Мои «Близкие друзья»
      responses: { "200": { description: "{ids: [int]}" } }
    put:
      summary: Заменить список «Близких друзей» (видят истории «для близких»)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: integer } } } }
      responses: { "204": { description: Готово } }
  /v1/devices/current/push:
    put:
      summary: Токен пушей FCM этого телефона ("" — не присылать)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { token: { type: string } } }
      responses: { "204": { description: Готово } }
  /v1/posts/{postId}/comments:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Комментарии по порядку (старые сверху); курсор — номер последнего
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
                  next: { type: [string, "null"] }
        "403": { description: Закрытый профиль }
    post:
      summary: Комментировать (выключены — только автору записи)
      parameters:
        - $ref: "#/components/parameters/idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 1000 }
                replyTo: { type: string, description: Имя того, кому ответ }
                sticker: { $ref: "#/components/schemas/Attachment" }
      responses:
        "201":
          description: Комментарий
          content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } }
        "403": { description: Комментарии выключены или профиль закрыт }
  /v1/comments/{commentId}:
    delete:
      summary: Удалить (свой — всегда; под своей записью — любой)
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { "204": { description: Удалён } }
  /v1/comments/{commentId}/like:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      summary: «Нравится» комментарию
      responses: { "204": { description: Готово } }
    delete:
      summary: Убрать «нравится»
      responses: { "204": { description: Готово } }
  /v1/stories:
    get:
      summary: Живые истории (24 часа) — свои и тех, на кого подписан; «для близких» — только им
      responses:
        "200":
          description: Истории по времени
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Story" } }
    post:
      summary: Новая история (фото/видео — сначала загрузкой tus)
      parameters:
        - $ref: "#/components/parameters/idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 300 }
                bg: { type: integer }
                seed: { type: integer }
                close: { type: boolean, description: Только «Близким друзьям» }
                media: { $ref: "#/components/schemas/Attachment" }
      responses:
        "201":
          description: История
          content: { application/json: { schema: { $ref: "#/components/schemas/Story" } } }
  /v1/stories/{storyId}:
    delete:
      summary: Удалить свою историю
      parameters:
        - { name: storyId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { "204": { description: Удалена } }
  /v1/stories/{storyId}/view:
    post:
      summary: Посмотрел (liked — с сердечком); автор увидит в «Кто смотрел»
      parameters:
        - { name: storyId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { liked: { type: boolean } } }
      responses: { "204": { description: Готово } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    cursor: { name: cursor, in: query, schema: { type: string }, description: "Из `next` прошлой страницы" }
    idempotency:
      name: Idempotency-Key
      in: header
      schema: { type: string, format: uuid }
      description: Один и тот же при каждом повторе одного действия
  schemas:
    Tokens:
      type: object
      required: [access, refresh, expiresIn, deviceId]
      properties:
        access: { type: string, description: Токен доступа (15 минут) }
        refresh: { type: string, description: Токен обновления (одноразовый) }
        expiresIn: { type: integer, description: секунды }
        deviceId: { type: string }
        user:
          type: object
          description: Кто вошёл — свой номер на сервере (демо-сервер не шлёт)
          properties: { id: { type: integer }, login: { type: string }, name: { type: string } }
    User:
      type: object
      required: [id, name, handle]
      properties:
        id: { type: integer, description: "С 100 000 — не пересекается с демо-людьми" }
        login: { type: string }
        handle: { type: string }
        name: { type: string }
        hue: { type: number }
        bio: { type: string }
        city: { type: string }
        publicKey: { type: string, description: "X25519, base64; пусто — ещё не прислал" }
        closed: { type: boolean, description: Закрытый профиль }
        followers: { type: integer }
        following: { type: integer }
        followState: { enum: [self, none, requested, following], description: Моя подписка на него }
        followsMe: { type: boolean }
    UserList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
    Comment:
      type: object
      required: [id, author, text]
      properties:
        id: { type: integer, format: int64 }
        post: { type: integer, format: int64 }
        author: { type: integer }
        text: { type: string }
        replyTo: { type: string }
        sticker: { $ref: "#/components/schemas/Attachment" }
        createdAt: { type: integer, format: int64 }
        likes: { type: integer }
        liked: { type: boolean }
        authorInfo: { $ref: "#/components/schemas/AuthorInfo" }
    Story:
      type: object
      required: [id, author, createdAt]
      properties:
        id: { type: integer, format: int64 }
        author: { type: integer }
        createdAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        text: { type: string }
        bg: { type: integer }
        seed: { type: integer }
        close: { type: boolean }
        media: { $ref: "#/components/schemas/Attachment" }
        seen: { type: boolean, description: Я её уже смотрел }
        views:
          type: array
          description: Кто смотрел — только автору
          items:
            type: object
            properties: { user: { type: integer }, at: { type: integer, format: int64 }, liked: { type: boolean } }
        authorInfo: { $ref: "#/components/schemas/AuthorInfo" }
    AuthorInfo:
      type: object
      description: Кто автор — чтобы телефон знал имя без отдельного запроса
      properties: { id: { type: integer }, name: { type: string }, handle: { type: string }, hue: { type: number } }
    Profile:
      type: object
      properties:
        name: { type: string }
        bio: { type: string }
        city: { type: string }
        birthday: { type: string }
        website: { type: string }
        interests: { type: array, items: { type: string } }
        privacy: { type: object, description: "Как Privacy в приложении, включая hiddenWords, hideOffensive, hideSpam" }
        updatedAt: { type: integer, format: int64 }
    Group:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        members: { type: array, items: { type: integer } }
        admins: { type: array, items: { type: integer } }
        owner: { type: integer }
        kind: { enum: [group, direct] }
        accepted: { type: boolean, description: "Я принял переписку (false — это запрос ко мне)" }
        user: { $ref: "#/components/schemas/User", description: "Собеседник (у личной)" }
    PostPage:
      type: object
      required: [items, next]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Post" } }
        next: { type: [string, "null"] }
    Attachment:
      type: object
      required: [id, kind, path]
      properties:
        id: { type: string }
        kind: { enum: [Photo, Video, Document] }
        path: { type: string, description: На сервере — адрес загрузки }
        name: { type: string }
        size: { type: integer, format: int64 }
        mime: { type: string }
        voice: { type: boolean }
        durationMs: { type: integer, format: int64 }
        sticker: { type: boolean }
        tags:
          type: array
          items:
            type: object
            properties: { user: { type: integer }, x: { type: number }, y: { type: number } }
    Post:
      type: object
      required: [id, author, text]
      properties:
        id: { type: integer, format: int64 }
        author: { type: integer, description: Номер человека }
        text: { type: string, maxLength: 2000 }
        createdAt: { type: integer, format: int64, description: мс }
        editedAt: { type: integer, format: int64 }
        likes: { type: integer }
        liked: { type: boolean }
        comments: { type: integer }
        artSeed: { type: [integer, "null"] }
        media: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        checkIn: { type: [object, "null"] }
        poll: { type: [object, "null"] }
        repostOf: { type: [object, "null"] }
        reposts: { type: integer }
        place:
          type: [object, "null"]
          properties: { lat: { type: number }, lon: { type: number }, title: { type: string } }
        commentsOff: { type: boolean }
        authorInfo: { $ref: "#/components/schemas/AuthorInfo" }
    Message:
      type: object
      required: [id, fromMe, text, time]
      properties:
        id: { type: integer, format: int64 }
        fromMe: { type: boolean }
        text: { type: string, maxLength: 4000 }
        time: { type: string }
        secret: { type: boolean }
        expiresAt: { type: integer, format: int64 }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        replyTo: { type: [object, "null"] }
        poll: { type: [object, "null"] }
        place: { type: [object, "null"] }
        sentAt: { type: integer, format: int64, description: Время сервера, мс }
        authorId: { type: integer, description: "Кто написал (в группах)" }
        delivered: { type: boolean }
        readBy: { type: array, items: { type: integer } }
        authorInfo: { $ref: "#/components/schemas/AuthorInfo" }
