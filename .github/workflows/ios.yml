# iPhone: сборка и юнит-тесты приложения из папки ios/ на симуляторе.
#
# Запускается, только когда меняется ios/ (или этот файл): Android-PR не
# ждут macOS-машину. Подпись не нужна — сборка для симулятора и проверочная
# сборка под iPhone идут с CODE_SIGNING_ALLOWED=NO. Поставить приложение на
# свой iPhone — через Xcode по кабелю, см. ios/README.md.

name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main, develop]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ios (simulator)
    # Проект в формате Xcode 16 (папки синхронизируются сами) — нужен образ с Xcode 16+
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Симулятор iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in devices:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          if best is None:
              sys.exit("нет доступного симулятора iPhone")
          print(best[1])
          print(f"{best[2]}, iOS {best[0][0]}.{best[0][1]}", file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Ключи Jamendo (медиатека) и GIPHY (поиск гифок) — из секретов; без них — пустые
      - name: Ключи API
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          GIPHY_API_KEY: ${{ secrets.IOS_GIPHY_API_KEY }}
        run: |
          plutil -create xml1 Memory/Secrets.plist
          plutil -insert JAMENDO_CLIENT_ID -string "$JAMENDO_CLIENT_ID" Memory/Secrets.plist
          plutil -insert GIPHY_API_KEY -string "$GIPHY_API_KEY" Memory/Secrets.plist

      - name: Сборка и юнит-тесты
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Memory.xcodeproj \
            -scheme Memory \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-test.log

      # Проверочная сборка под настоящий iPhone (arm64, без подписи):
      # ловит то, что собирается для симулятора, но не для устройства
      - name: Сборка под iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project Memory.xcodeproj \
            -scheme Memory \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-device.log

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-reports
          path: |
            ios/build/*.log
            ios/build/Tests.xcresult
          retention-days: 14
          if-no-files-found: ignore
