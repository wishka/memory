# Тестовая сборка для себя и тестировщиков — после каждого слияния в develop.
#
# develop → проверки → APK «Memory dev» → GitHub-выпуск «dev» (пре-релиз,
# всегда последний). Постоянная ссылка на файл:
#   https://github.com/<владелец>/<репозиторий>/releases/download/dev/memory-dev.apk
#
# Сборка подписывается общим ключом разработки (секреты окружения dev).
# С ним каждая следующая dev-сборка ставится поверх предыдущей; без
# него — ключом машины CI, и перед установкой придётся удалять старую.

name: Dev build

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/dev
    permissions:
      contents: write
    env:
      VERSION_NAME: dev-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Версия
        # Код версии — от времени сборки: растёт всегда, поэтому dev- и
        # демо-сборки встают поверх друг друга в любом порядке
        run: echo "VERSION_CODE=$(( $(date +%s) / 10 ))" >> "$GITHUB_ENV"

      - name: Ключ разработки
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dev.jks"
            echo "DEV_KEYSTORE_PATH=$RUNNER_TEMP/dev.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета DEV_KEYSTORE_BASE64 — сборка не встанет поверх прежней (docs/CICD.md)"
          fi

      - name: Сборка
        env:
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          GIPHY_API_KEY: ${{ secrets.ANDROID_GIPHY_API_KEY }}
          SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Выпуск «dev»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk memory-dev.apk
          rm -f "$RUNNER_TEMP/dev.jks"
          # Выпуск один и тот же: старый удаляется вместе с тегом, новый
          # ставится на текущий коммит develop
          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          gh release create dev memory-dev.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Memory dev-${{ github.run_number }}" \
            --notes "Тестовая сборка из develop, коммит ${GITHUB_SHA::7}. Ставится как отдельное приложение «Memory» с пометкой .debug."
