# Демо-сборка для телефона — из любой ветки, по кнопке.
#
# GitHub → Actions → «Demo build» → Run workflow → выбрать ветку → Run.
# Через несколько минут APK лежит в выпуске «demo» по постоянной ссылке —
# её можно открыть прямо на телефоне:
#   https://github.com/<владелец>/memory/releases/download/demo/memory-demo.apk
#
# Подписывается общим ключом разработки (окружение dev), как и dev-сборки,
# поэтому демо и dev ставятся поверх друг друга без удаления.

name: Demo build

on:
  workflow_dispatch:

concurrency:
  group: demo-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/demo
    permissions:
      contents: write
    env:
      VERSION_NAME: demo-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Версия
        # Код версии — от времени сборки: растёт всегда, поэтому dev- и
        # демо-сборки встают поверх друг друга в любом порядке
        run: echo "VERSION_CODE=$(( $(date +%s) / 10 ))" >> "$GITHUB_ENV"

      - name: Ключ разработки
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dev.jks"
            echo "DEV_KEYSTORE_PATH=$RUNNER_TEMP/dev.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета DEV_KEYSTORE_BASE64 — перед установкой придётся удалить прежнюю версию"
          fi

      - name: Сборка
        env:
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Выпуск «demo»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk memory-demo.apk
          rm -f "$RUNNER_TEMP/dev.jks"
          gh release delete demo --cleanup-tag --yes 2>/dev/null || true
          gh release create demo memory-demo.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Memory demo-${{ github.run_number }} (${GITHUB_REF_NAME})" \
            --notes "Демо из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}. Вход без регистрации: логин demo, пароль memory2026."

      - uses: actions/upload-artifact@v4
        with:
          name: memory-demo-apk
          path: memory-demo.apk
          retention-days: 14
