# Проверки: сборка отладочного APK, юнит-тесты, lint.
#
# Запускается на каждый pull request и push в main, а также вызывается
# из dev-build.yml (push в develop) и release.yml (тег) — выпуск не начнётся, пока
# не прошли проверки. Имя задания «build (debug)» — обязательная проверка
# в защите веток (scripts/setup-github.sh): переименуете — поправьте и там.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # Документы для iPhone (ios/Memory/Legal) — копии docs/legal
      - name: Документы совпадают
        run: python3 scripts/sync_legal.py --check

      # Гид в приложении собран из docs/guide/guide.json (Kotlin и Swift)
      - name: Гид совпадает
        run: python3 scripts/sync_guide.py --check

      - name: Сборка
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          GIPHY_API_KEY: ${{ secrets.ANDROID_GIPHY_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Юнит-тесты
        run: ./gradlew testDebugUnitTest

      # Lint пока не блокирует: отчёт — в артефактах. Когда он станет
      # чистым, уберите continue-on-error.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintDebug

      - uses: actions/upload-artifact@v6
        with:
          name: memory-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore
