# Выпуск по тегу.
#
#   git checkout main && git pull
#   git tag v0.2.0 && git push origin v0.2.0
#
# Тег vX.Y.Z на main → проверки → подтверждение (окружение production)
# → подписанные APK и AAB → GitHub Release с контрольными суммами.
# AAB — для будущей публикации в RuStore / Google Play.
#
# Код версии считается из тега: X*10000 + Y*100 + Z (v1.2.3 → 10203).
# Он обязан расти от выпуска к выпуску — иначе магазин не примет сборку,
# а телефон не поставит её поверх установленной.

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Тег стоит на main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Тег ${GITHUB_REF_NAME} не на ветке main. Выпуск — только из main (docs/CICD.md)"
            exit 1
          fi
      - name: Версия из тега
        id: v
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::Минорная и патч-версия — не больше 99"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    # Ключ подписи — секреты окружения production; задание ждёт
    # подтверждения владельца репозитория
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Ключ подписи
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 — подписать выпуск нечем (docs/CICD.md)"; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Сборка
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Проверка подписи и файлы выпуска
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/memory-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/memory-$VERSION_NAME.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          # Неподписанный APK не установится — лучше узнать это здесь
          "$APKSIGNER" verify --print-certs "dist/memory-$VERSION_NAME.apk" | tee dist/signature.txt
          (cd dist && sha256sum memory-* > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v6
        with:
          name: memory-${{ needs.version.outputs.name }}
          path: dist/

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/memory-$VERSION_NAME.apk" \
            "dist/memory-$VERSION_NAME.aab" \
            dist/SHA256SUMS.txt \
            --title "Memory $VERSION_NAME" \
            --generate-notes --verify-tag
